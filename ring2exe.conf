# ==============================================================================
# Mejde Network - Ring2EXE Plus Configuration
# ==============================================================================

# Source file to build
source = app.ring

# Output executable name
output = Mejde

# GUI mode: hides the black console window on Windows
gui = true

# Automatically detect and bundle required Ring libraries (webview, libsql, etc.)
auto-libs = true

# Embed official Mejde brand icon directly into the executable
icon = public/logo.ico

# Build optimized release binary (-O3)
release = true

# Remove temporary build artifacts
keep = false

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070709" />
  <title>Mejde | مَجْد - شبكة اجتماعية لامركزية</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    (function() {
      try {
        var test = window.localStorage;
        test.setItem('__mejde_test', '1');
        test.removeItem('__mejde_test');
      } catch (e) {
        var createMemoryStore = function() {
          var store = {};
          return {
            getItem: function(k) { return store.hasOwnProperty(k) ? store[k] : null; },
            setItem: function(k, v) { store[k] = String(v); },
            removeItem: function(k) { delete store[k]; },
            clear: function() { store = {}; },
            get length() { return Object.keys(store).length; },
            key: function(i) { return Object.keys(store)[i] || null; }
          };
        };
        try {
          Object.defineProperty(window, 'localStorage', {
            value: createMemoryStore(),
            configurable: true,
            enumerable: true,
            writable: true
          });
          Object.defineProperty(window, 'sessionStorage', {
            value: createMemoryStore(),
            configurable: true,
            enumerable: true,
            writable: true
          });
        } catch (err) {}
      }
    })();
  </script>
</head>
<body class="bg-[#070709] text-white selection:bg-indigo-500 selection:text-white">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

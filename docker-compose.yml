version: '3.8'

services:
  mejde-mother-node:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mejde-mother-node
    restart: unless-stopped
    ports:
      - "8545:8545"
    environment:
      - PORT=8545
      - DB_FILE=/data/social_mother.db
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545/p2p/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
